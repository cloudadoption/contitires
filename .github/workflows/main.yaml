name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - name: Install xvfb
      run: sudo apt-get install -y xvfb
    - name: Run tests
      run: xvfb-run -a npm test
    - run: npm run lint
